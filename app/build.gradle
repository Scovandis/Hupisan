plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'io.github.xilinjia.krdb'
}

android {
    namespace 'com.hupisan'
    compileSdk 34

    defaultConfig {
        applicationId "com.hupisan"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //support library
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"

    // swiperefreshlayout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // circlerimageview
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // fragment
    implementation "androidx.fragment:fragment-ktx:1.6.2"

    // sdp
    implementation 'com.intuit.sdp:sdp-android:1.1.0'

    // Realm / KRDB Kotlin SDK
    implementation 'io.github.xilinjia.krdb:library-base:3.2.9'

    def lifecycle_version = "2.6.2"
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version")
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version")
    implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version")

    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    def lottieVersion = '4.2.1'
    implementation "com.airbnb.android:lottie:$lottieVersion"

    // viewPager
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'com.github.romandanylyk:PageIndicatorView:v.1.0.3'

    // chart
    implementation 'com.github.blackfizz:eazegraph:1.2.5l@aar'
    implementation 'com.nineoldandroids:library:2.4.0'

    // dexter
    implementation 'com.karumi:dexter:6.2.3'

    // roundedimageview
    implementation 'com.makeramen:roundedimageview:2.3.0'

    // coroutine
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // kotlin recycler animator
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'

    // koin
    def koin_version = "3.5.6"
    implementation "io.insert-koin:koin-android:$koin_version"
}


